  <path d="M 78 60 L 68 28 L 82 52 Z" fill="#1a0202"/>
  <path d="M 90 50 L 86 18 L 100 44 Z" fill="#1a0202"/>
  <path d="M 110 50 L 114 18 L 100 44 Z" fill="#1a0202"/>
