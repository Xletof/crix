  <ellipse cx="114" cy="78" rx="7" ry="6" fill="#000"/>
  <ellipse cx="86" cy="77" rx="5" ry="4" fill="#ffd166"/>
  <ellipse cx="114" cy="77" rx="5" ry="4" fill="#ffd166"/>
