  <ellipse cx="34" cy="80" rx="14" ry="22" fill="#2e0606"/>
  <ellipse cx="166" cy="80" rx="14" ry="22" fill="#2e0606"/>
  <ellipse cx="34" cy="80" rx="10" ry="18" fill="#9b2c2c"/>
  <ellipse cx="166" cy="80" rx="10" ry="18" fill="#9b2c2c"/>

  <!-- claws facing forward -->
  <path d="M 22 56 L 20 36 L 28 52 Z" fill="#f5f5f5"/>
