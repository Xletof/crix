  <circle cx="55" cy="46" r="1.4" fill="#fff"/>
  <circle cx="73" cy="46" r="1.4" fill="#fff"/>

  <!-- mouth with teeth -->
  <path d="M 50 56 L 78 56 L 74 64 L 54 64 Z" fill="#1a0505"/>
  <path d="M 55 56 L 57 61 L 59 56 Z" fill="#fff"/>
  <path d="M 61 56 L 63 62 L 65 56 Z" fill="#fff"/>
  <path d="M 67 56 L 69 62 L 71 56 Z" fill="#fff"/>
  <path d="M 73 56 L 75 61 L 77 56 Z" fill="#fff"/>
