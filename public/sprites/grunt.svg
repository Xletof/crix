<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
<defs>
  <radialGradient id="gb" cx="42%" cy="36%" r="56%">
    <stop offset="0%"   stop-color="#ff5e3c"/>
    <stop offset="58%"  stop-color="#c42020"/>
    <stop offset="100%" stop-color="#5a0000"/>
  </radialGradient>
  <radialGradient id="gh" cx="40%" cy="32%" r="54%">
    <stop offset="0%"   stop-color="#ff7050"/>
    <stop offset="100%" stop-color="#5a0000"/>
  </radialGradient>
  <radialGradient id="ge" cx="30%" cy="28%" r="66%">
    <stop offset="0%"   stop-color="#ffff80"/>
    <stop offset="60%"  stop-color="#ffa820"/>
    <stop offset="100%" stop-color="#cc5000"/>
  </radialGradient>
  <radialGradient id="gleg" cx="44%" cy="38%" r="54%">
    <stop offset="0%"   stop-color="#cc2818"/>
    <stop offset="100%" stop-color="#480000"/>
  </radialGradient>
  <linearGradient id="gclaw" x1="50%" y1="100%" x2="50%" y2="0%">
    <stop offset="0%"   stop-color="#c8c8c0"/>
    <stop offset="100%" stop-color="#f8f8f0"/>
  </linearGradient>
</defs>

<!-- Drop shadow -->
<ellipse cx="64" cy="110" rx="30" ry="7" fill="#000" opacity="0.2"/>

<!-- THICK LEGS -->
<ellipse cx="51" cy="100" rx="14" ry="8" fill="#380000" transform="rotate(-8,51,100)"/>
<ellipse cx="77" cy="100" rx="14" ry="8" fill="#380000" transform="rotate(8,77,100)"/>
<ellipse cx="50" cy="97" rx="8" ry="4" fill="url(#gleg)" opacity="0.85"/>
<ellipse cx="76" cy="97" rx="8" ry="4" fill="url(#gleg)" opacity="0.85"/>
<!-- Toenail nubs -->
<ellipse cx="46" cy="102" rx="3" ry="2" fill="#200000"/>
<ellipse cx="54" cy="104" rx="3" ry="2" fill="#200000"/>
<ellipse cx="72" cy="104" rx="3" ry="2" fill="#200000"/>
<ellipse cx="80" cy="102" rx="3" ry="2" fill="#200000"/>

<!-- BODY (wide and menacing) -->
<ellipse cx="64" cy="79" rx="32" ry="24" fill="url(#gb)"/>
<!-- Belly fold highlight -->
<path d="M 38 84 Q 64 92 90 84" stroke="#ff7050" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>
<!-- Upper chest highlight -->
<path d="M 40 70 Q 64 63 88 70" stroke="#ff8060" stroke-width="2.5" fill="none" opacity="0.4" stroke-linecap="round"/>
<!-- Belly scar / war marking -->
<path d="M 52 76 L 58 86" stroke="#900000" stroke-width="2.5" opacity="0.55"/>
<path d="M 70 74 L 76 84" stroke="#900000" stroke-width="2.5" opacity="0.55"/>
<!-- Battle rune on chest -->
<path d="M 60 78 L 64 72 L 68 78 L 64 84Z" fill="#7a0000" opacity="0.7"/>
<path d="M 61 78 L 64 74 L 67 78 L 64 82Z" fill="#cc2020" opacity="0.6"/>

<!-- LEFT ARM (thick, raised) -->
<path d="M 38 78 Q 28 66 22 50" stroke="#8a1010" stroke-width="13" stroke-linecap="round" fill="none"/>
<path d="M 38 78 Q 28 66 22 50" stroke="#c83030" stroke-width="9" stroke-linecap="round" fill="none"/>

<!-- LEFT KNUCKLES / wrist -->
<circle cx="22" cy="50" r="10" fill="#5a0000"/>
<circle cx="22" cy="49" r="7" fill="#b02020"/>

<!-- LEFT CLAWS (pointing UP) -->
<path d="M 15 48 L 10 28 L 18 44" fill="url(#gclaw)"/>
<path d="M 22 46 L 19 24 L 26 43" fill="url(#gclaw)"/>
<path d="M 29 48 L 30 26 L 34 44" fill="url(#gclaw)"/>
<!-- Claw shadow/rim -->
<path d="M 15 48 L 10 28 L 18 44" stroke="#707060" stroke-width="1" fill="none" opacity="0.5"/>
<path d="M 22 46 L 19 24 L 26 43" stroke="#707060" stroke-width="1" fill="none" opacity="0.5"/>
<path d="M 29 48 L 30 26 L 34 44" stroke="#707060" stroke-width="1" fill="none" opacity="0.5"/>

<!-- RIGHT ARM (thick, raised) -->
<path d="M 90 78 Q 100 66 106 50" stroke="#8a1010" stroke-width="13" stroke-linecap="round" fill="none"/>
<path d="M 90 78 Q 100 66 106 50" stroke="#c83030" stroke-width="9" stroke-linecap="round" fill="none"/>

<!-- RIGHT KNUCKLES -->
<circle cx="106" cy="50" r="10" fill="#5a0000"/>
<circle cx="106" cy="49" r="7" fill="#b02020"/>

<!-- RIGHT CLAWS (pointing UP) -->
<path d="M 113 48 L 118 28 L 110 44" fill="url(#gclaw)"/>
<path d="M 106 46 L 109 24 L 102 43" fill="url(#gclaw)"/>
<path d="M 99 48 L 98 26 L 94 44" fill="url(#gclaw)"/>
<path d="M 113 48 L 118 28 L 110 44" stroke="#707060" stroke-width="1" fill="none" opacity="0.5"/>
<path d="M 106 46 L 109 24 L 102 43" stroke="#707060" stroke-width="1" fill="none" opacity="0.5"/>
<path d="M 99 48 L 98 26 L 94 44" stroke="#707060" stroke-width="1" fill="none" opacity="0.5"/>

<!-- HEAD -->
<ellipse cx="64" cy="56" rx="25" ry="24" fill="url(#gh)"/>
<!-- Head highlight dome -->
<ellipse cx="56" cy="46" rx="10" ry="8" fill="#ff9070" opacity="0.28"/>
<!-- Brow ridge (heavy) -->
<path d="M 42 52 Q 64 42 86 52 L 86 47 Q 64 38 42 47Z" fill="#5a0000" opacity="0.85"/>
<!-- Neck scale lines -->
<path d="M 46 66 Q 64 72 82 66" stroke="#8a1010" stroke-width="2" fill="none" opacity="0.5"/>

<!-- HORNS (pointing UP) -->
<path d="M 50 40 Q 42 20 46 6" stroke="#3a0000" stroke-width="8" stroke-linecap="round" fill="none"/>
<path d="M 50 40 Q 42 20 46 6" stroke="#6a1010" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
<path d="M 78 40 Q 86 20 82 6" stroke="#3a0000" stroke-width="8" stroke-linecap="round" fill="none"/>
<path d="M 78 40 Q 86 20 82 6" stroke="#6a1010" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
<!-- Small center horn -->
<path d="M 64 38 Q 64 22 64 10" stroke="#3a0000" stroke-width="6" stroke-linecap="round" fill="none"/>
<path d="M 64 38 Q 64 22 64 10" stroke="#6a1010" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

<!-- EYES (glowing yellow) -->
<ellipse cx="53" cy="54" rx="7.5" ry="6.5" fill="#1a0000"/>
<ellipse cx="75" cy="54" rx="7.5" ry="6.5" fill="#1a0000"/>
<ellipse cx="53" cy="53" rx="5.5" ry="5" fill="url(#ge)"/>
<ellipse cx="75" cy="53" rx="5.5" ry="5" fill="url(#ge)"/>
<!-- Pupil slits (vertical) -->
<rect x="52.5" y="50" width="1.5" height="7" rx="0.75" fill="#1a0000" opacity="0.7"/>
<rect x="74.5" y="50" width="1.5" height="7" rx="0.75" fill="#1a0000" opacity="0.7"/>
<!-- Eye highlight -->
<ellipse cx="51" cy="51" rx="2" ry="1.5" fill="#fff" opacity="0.55"/>
<ellipse cx="73" cy="51" rx="2" ry="1.5" fill="#fff" opacity="0.55"/>
<!-- Eye glow halo -->
<ellipse cx="53" cy="54" rx="9" ry="8" fill="#ffa000" opacity="0.14"/>
<ellipse cx="75" cy="54" rx="9" ry="8" fill="#ffa000" opacity="0.14"/>

<!-- JAW / TEETH -->
<path d="M 46 64 Q 64 72 82 64" stroke="#4a0000" stroke-width="3.5" fill="none"/>
<path d="M 48 65 Q 64 73 80 65 Q 64 78 48 65Z" fill="#280000" opacity="0.85"/>
<!-- Fangs (4 lower) -->
<polygon points="52,66 55,76 58,66" fill="#e8e8d8"/>
<polygon points="60,67 63,79 66,67" fill="#e8e8d8"/>
<polygon points="68,67 71,79 74,67" fill="#e8e8d8"/>
<polygon points="76,66 79,76 82,66" fill="#e8e8d8"/>
</svg>
