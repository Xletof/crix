  <circle cx="64" cy="48" r="18" fill="#d94f4f"/>

  <!-- horns -->
  <path d="M 48 36 L 40 18 L 52 30 Z" fill="#1a0505"/>
  <path d="M 80 36 L 88 18 L 76 30 Z" fill="#1a0505"/>

  <!-- brow shadow -->
