  <ellipse cx="64" cy="91" rx="28" ry="13" fill="#d94f4f"/>

  <!-- torso -->
  <ellipse cx="64" cy="74" rx="34" ry="20" fill="#4a1414"/>
  <ellipse cx="64" cy="73" rx="30" ry="17" fill="#d94f4f"/>
  <ellipse cx="64" cy="70" rx="16" ry="6" fill="#ed7575" opacity="0.55"/>

  <!-- shoulder spikes -->
  <path d="M 28 60 L 18 48 L 32 56 Z" fill="#1a0505"/>
  <path d="M 100 60 L 110 48 L 96 56 Z" fill="#1a0505"/>

  <!-- arms -->
  <ellipse cx="30" cy="56" rx="10" ry="16" fill="#4a1414"/>
  <ellipse cx="98" cy="56" rx="10" ry="16" fill="#4a1414"/>
  <ellipse cx="30" cy="56" rx="7" ry="12" fill="#d94f4f"/>
  <ellipse cx="98" cy="56" rx="7" ry="12" fill="#d94f4f"/>

  <!-- hand-claws -->
  <path d="M 22 38 L 24 26 L 28 38 Z" fill="#f0f0f0"/>
  <path d="M 28 38 L 30 24 L 34 38 Z" fill="#f0f0f0"/>
  <path d="M 34 38 L 38 26 L 38 38 Z" fill="#f0f0f0"/>
  <path d="M 90 38 L 90 26 L 94 38 Z" fill="#f0f0f0"/>
  <path d="M 94 38 L 98 24 L 100 38 Z" fill="#f0f0f0"/>
  <path d="M 100 38 L 104 26 L 106 38 Z" fill="#f0f0f0"/>

  <!-- head -->
