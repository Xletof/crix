<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
<defs>
  <radialGradient id="pb" cx="40%" cy="36%" r="56%">
    <stop offset="0%"   stop-color="#5abeff"/>
    <stop offset="55%"  stop-color="#1c54cc"/>
    <stop offset="100%" stop-color="#091a78"/>
  </radialGradient>
  <radialGradient id="ph" cx="38%" cy="32%" r="54%">
    <stop offset="0%"   stop-color="#74ccff"/>
    <stop offset="100%" stop-color="#082068"/>
  </radialGradient>
  <radialGradient id="pv" cx="33%" cy="26%" r="68%">
    <stop offset="0%"   stop-color="#d8f8ff"/>
    <stop offset="42%"  stop-color="#10d4f2"/>
    <stop offset="100%" stop-color="#005a88"/>
  </radialGradient>
  <linearGradient id="pgn" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#1e2438"/>
    <stop offset="38%"  stop-color="#5868a0"/>
    <stop offset="62%"  stop-color="#5868a0"/>
    <stop offset="100%" stop-color="#1e2438"/>
  </linearGradient>
  <radialGradient id="psp" cx="44%" cy="40%" r="55%">
    <stop offset="0%"   stop-color="#3070e8"/>
    <stop offset="100%" stop-color="#0c2880"/>
  </radialGradient>
  <radialGradient id="pleg" cx="44%" cy="38%" r="54%">
    <stop offset="0%"   stop-color="#2258cc"/>
    <stop offset="100%" stop-color="#081660"/>
  </radialGradient>
</defs>

<!-- Drop shadow -->
<ellipse cx="64" cy="109" rx="25" ry="6" fill="#000" opacity="0.18"/>

<!-- BOOTS -->
<ellipse cx="52" cy="100" rx="12" ry="7" fill="#091a64" transform="rotate(-8,52,100)"/>
<ellipse cx="76" cy="100" rx="12" ry="7" fill="#091a64" transform="rotate(8,76,100)"/>
<ellipse cx="51" cy="97" rx="7" ry="3.5" fill="url(#pleg)" opacity="0.8"/>
<ellipse cx="75" cy="97" rx="7" ry="3.5" fill="url(#pleg)" opacity="0.8"/>
<!-- Boot tech seams -->
<line x1="47" y1="99" x2="57" y2="99" stroke="#2a60d8" stroke-width="1.5" opacity="0.6"/>
<line x1="71" y1="99" x2="81" y2="99" stroke="#2a60d8" stroke-width="1.5" opacity="0.6"/>

<!-- TORSO / BODY -->
<ellipse cx="64" cy="80" rx="27" ry="22" fill="url(#pb)"/>
<!-- Belly armor plate -->
<path d="M 46 87 Q 64 95 82 87 L 84 95 Q 64 102 44 95Z" fill="#081664" opacity="0.75"/>
<!-- Chest highlight band -->
<path d="M 42 71 Q 64 65 86 71" stroke="#90d4ff" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round"/>
<!-- Lower chest band -->
<path d="M 44 86 Q 64 90 84 86" stroke="#2060c8" stroke-width="2" fill="none" opacity="0.35" stroke-linecap="round"/>
<!-- Center insignia -->
<circle cx="64" cy="80" r="7" fill="#081664" opacity="0.92"/>
<circle cx="64" cy="80" r="4.5" fill="#28a4ff" opacity="0.88"/>
<circle cx="64" cy="80" r="2" fill="#b0eaff"/>
<!-- Vertical armor seams -->
<line x1="50" y1="70" x2="50" y2="90" stroke="#081664" stroke-width="2" opacity="0.5"/>
<line x1="78" y1="70" x2="78" y2="90" stroke="#081664" stroke-width="2" opacity="0.5"/>

<!-- LEFT SHOULDER PAD -->
<ellipse cx="39" cy="75" rx="14" ry="9" fill="#1a50d0" transform="rotate(-14,39,75)"/>
<ellipse cx="37" cy="71" rx="6" ry="3.5" fill="#68c0ff" opacity="0.55"/>
<ellipse cx="40" cy="80" rx="5" ry="2.5" fill="#091664" opacity="0.6"/>
<path d="M 29 67 Q 35 61 46 69" stroke="#0828a0" stroke-width="2" fill="none" opacity="0.55"/>

<!-- RIGHT SHOULDER PAD -->
<ellipse cx="89" cy="75" rx="14" ry="9" fill="#1a50d0" transform="rotate(14,89,75)"/>
<ellipse cx="91" cy="71" rx="6" ry="3.5" fill="#68c0ff" opacity="0.55"/>
<ellipse cx="88" cy="80" rx="5" ry="2.5" fill="#091664" opacity="0.6"/>
<path d="M 99 67 Q 93 61 82 69" stroke="#0828a0" stroke-width="2" fill="none" opacity="0.55"/>

<!-- HANDS / GLOVES -->
<circle cx="33" cy="83" r="8.5" fill="url(#psp)"/>
<circle cx="32" cy="81" r="4" fill="#3878e8" opacity="0.6"/>
<circle cx="95" cy="83" r="8.5" fill="url(#psp)"/>
<circle cx="96" cy="81" r="4" fill="#3878e8" opacity="0.6"/>

<!-- ═══ GUN — barrel points UP toward y=0 ═══ -->
<!-- Receiver body -->
<rect x="59" y="52" width="10" height="28" rx="4" fill="#1a2240"/>
<!-- Barrel (main tube) -->
<rect x="61.5" y="6" width="5" height="48" rx="2.5" fill="url(#pgn)"/>
<!-- Barrel inner highlight -->
<rect x="62" y="6" width="1.5" height="48" rx="0.75" fill="#b0c4e0" opacity="0.45"/>
<!-- Muzzle cap -->
<rect x="60" y="1" width="8" height="7" rx="2.5" fill="#1a2038"/>
<!-- Muzzle glow ring -->
<circle cx="64" cy="3" r="3.5" fill="#50b8ff" opacity="0.7"/>
<!-- Rail / scope base -->
<rect x="58" y="17" width="12" height="5" rx="2" fill="#10182a"/>
<!-- Scope lens (glowing) -->
<rect x="58.5" y="18" width="11" height="3" rx="1" fill="#14d4f0" opacity="0.94"/>
<circle cx="64" cy="19.5" r="1" fill="#a8f4ff" opacity="0.85"/>
<!-- Vertical foregrip -->
<rect x="60" y="31" width="4" height="10" rx="2" fill="#0e1428"/>
<!-- Magazine -->
<rect x="64" y="44" width="9" height="7" rx="2.5" fill="#0e1428"/>
<rect x="65" y="45" width="7" height="5" rx="1.5" fill="#1c2240"/>
<!-- Trigger guard -->
<path d="M 59 61 Q 55 66 59 72" stroke="#303a60" stroke-width="2.5" fill="none"/>

<!-- ═══ HELMET ═══ -->
<ellipse cx="64" cy="57" rx="22" ry="23" fill="url(#ph)"/>
<!-- Helmet top crest fin -->
<path d="M 57 35 Q 64 25 71 35" fill="#0b2260" opacity="0.88"/>
<!-- Cheek ridges -->
<path d="M 43 62 Q 64 68 85 62" stroke="#0f3ab0" stroke-width="3" fill="none" opacity="0.5"/>
<path d="M 45 55 Q 44 60 46 65" stroke="#0f3ab0" stroke-width="2" fill="none" opacity="0.4"/>
<path d="M 83 55 Q 84 60 82 65" stroke="#0f3ab0" stroke-width="2" fill="none" opacity="0.4"/>
<!-- Side ear comm pieces -->
<rect x="41" y="52" width="7" height="12" rx="3.5" fill="#091850"/>
<rect x="80" y="52" width="7" height="12" rx="3.5" fill="#091850"/>
<!-- Ear lights -->
<circle cx="44.5" cy="58" r="2.5" fill="#30d8ff" opacity="0.94"/>
<circle cx="83.5" cy="58" r="2.5" fill="#30d8ff" opacity="0.94"/>
<!-- Vent slots on ears -->
<line x1="42" y1="55" x2="47" y2="55" stroke="#1848d0" stroke-width="1.5" opacity="0.7"/>
<line x1="81" y1="55" x2="86" y2="55" stroke="#1848d0" stroke-width="1.5" opacity="0.7"/>

<!-- ═══ VISOR (large, glowing cyan) ═══ -->
<path d="M 46 51 Q 47 38 64 37 Q 81 38 82 51 Q 82 65 64 66 Q 46 65 46 51Z"
      fill="url(#pv)" opacity="0.93"/>
<!-- Visor shine streak -->
<path d="M 51 43 Q 60 36 75 41" stroke="white" stroke-width="2.5" opacity="0.65"
      fill="none" stroke-linecap="round"/>
<!-- HUD scan-line elements -->
<line x1="52" y1="55" x2="61" y2="55" stroke="#00eaff" stroke-width="1" opacity="0.6"/>
<line x1="67" y1="55" x2="76" y2="55" stroke="#00eaff" stroke-width="1" opacity="0.6"/>
<!-- Targeting reticle dot -->
<circle cx="64" cy="52" r="2.5" fill="#00f2ff" opacity="0.55"/>
<circle cx="64" cy="52" r="4.5" fill="#00f2ff" opacity="0.18"/>
</svg>
