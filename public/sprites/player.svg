<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Top-down brawler "Crix": gun barrel points UP (negative y), Phaser rotates the sprite to face the aim angle. -->
  <!-- drop shadow -->
  <ellipse cx="64" cy="108" rx="34" ry="9" fill="#000" opacity="0.32"/>

  <!-- legs poking out from under torso -->
  <rect x="48" y="86" width="14" height="18" rx="6" fill="#0b3e8c"/>
  <rect x="66" y="86" width="14" height="18" rx="6" fill="#0b3e8c"/>
  <rect x="51" y="89" width="8" height="13" rx="3" fill="#1a4fa8"/>
  <rect x="69" y="89" width="8" height="13" rx="3" fill="#1a4fa8"/>

  <!-- torso / backpack hump -->
  <ellipse cx="64" cy="78" rx="30" ry="22" fill="#0b3e8c"/>
  <ellipse cx="64" cy="77" rx="26" ry="19" fill="#3a8bff"/>
  <ellipse cx="64" cy="72" rx="14" ry="7" fill="#5ba0ff" opacity="0.55"/>

  <!-- shoulder pads -->
  <circle cx="36" cy="64" r="11" fill="#0b3e8c"/>
  <circle cx="92" cy="64" r="11" fill="#0b3e8c"/>
  <circle cx="36" cy="64" r="7.5" fill="#3a8bff"/>
  <circle cx="92" cy="64" r="7.5" fill="#3a8bff"/>

  <!-- arms gripping rifle, forward -->
  <rect x="46" y="40" width="12" height="22" rx="6" fill="#0b3e8c"/>
  <rect x="70" y="40" width="12" height="22" rx="6" fill="#0b3e8c"/>

  <!-- gloves -->
  <circle cx="52" cy="36" r="7" fill="#1a1f2e"/>
  <circle cx="76" cy="36" r="7" fill="#1a1f2e"/>

  <!-- head -->
  <circle cx="64" cy="58" r="17" fill="#0b3e8c"/>
  <circle cx="64" cy="58" r="14" fill="#3a8bff"/>

  <!-- helmet top -->
  <path d="M 48 54 Q 64 36 80 54 L 80 50 Q 64 32 48 50 Z" fill="#0a2e6e"/>

  <!-- visor (cyan) -->
  <path d="M 50 55 Q 64 48 78 55 L 77 61 Q 64 56 51 61 Z" fill="#4cd9ff"/>
  <path d="M 50 55 Q 64 48 78 55" fill="none" stroke="#0a2e6e" stroke-width="2"/>
  <path d="M 53 56 Q 60 52 67 56" fill="none" stroke="#fff" stroke-width="1" opacity="0.7"/>

  <!-- rifle body -->
  <rect x="55" y="14" width="18" height="28" rx="2" fill="#1a1f2e"/>
  <rect x="58" y="16" width="12" height="24" fill="#3a3f4a"/>
  <!-- barrel -->
  <rect x="60" y="2" width="8" height="14" fill="#4b5563"/>
  <rect x="61" y="2" width="6" height="14" fill="#6b7280"/>
  <!-- front sight -->
  <rect x="62" y="0" width="4" height="3" fill="#1a1f2e"/>
  <!-- magazine -->
  <rect x="55" y="34" width="18" height="10" rx="2" fill="#1a1f2e"/>
  <rect x="58" y="36" width="12" height="6" fill="#2a2f3a"/>
  <!-- holo sight -->
  <circle cx="64" cy="22" r="3.5" fill="#4cd9ff"/>
  <circle cx="64" cy="22" r="1.6" fill="#fff"/>
</svg>
